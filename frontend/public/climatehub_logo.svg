<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Green circular background with wind turbine -->
  <circle cx="30" cy="30" r="25" fill="#10b981"/>
  <!-- Wind turbine blades -->
  <g transform="translate(30, 30)">
    <!-- Center hub -->
    <circle cx="0" cy="0" r="3" fill="white"/>
    <!-- Three blades -->
    <rect x="-2" y="-20" width="4" height="20" fill="white" rx="2"/>
    <rect x="-2" y="-20" width="4" height="20" fill="white" rx="2" transform="rotate(120)"/>
    <rect x="-2" y="-20" width="4" height="20" fill="white" rx="2" transform="rotate(240)"/>
  </g>
  <!-- ClimateHub text -->
  <text x="65" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    <tspan fill="#10b981">Climate</tspan>
    <tspan fill="#6b7280">Hub</tspan>
  </text>
  <!-- Tagline -->
  <text x="65" y="48" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
    Accelerating Climate Actions
  </text>
</svg>
